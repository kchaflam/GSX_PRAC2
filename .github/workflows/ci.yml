name: CI Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build backend image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/backend-gsx:${{ github.sha }} ./Containers/Python
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/backend-gsx:${{ github.sha }}

      - name: Build nginx image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/nginx-gsx:${{ github.sha }} ./Containers/Nginx
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/nginx-gsx:${{ github.sha }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform format check
        run: |
          cd Terraform
          terraform fmt -check

      - name: Terraform init (no backend)
        run: |
          cd Terraform
          terraform init -backend=false

      - name: Terraform validate
        run: |
          cd Terraform
          terraform validate
